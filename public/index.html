<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1 Million Checkboxes</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      @keyframes gradientShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @keyframes pulse-glow {
        0%,
        100% {
          box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }
        50% {
          box-shadow: 0 0 40px rgba(102, 126, 234, 0.6);
        }
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      body {
        background: linear-gradient(-45deg, #1a0033, #0f0f1e, #1a1a2e, #16213e);
        background-size: 400% 400%;
        animation: gradientShift 15s ease infinite;
        color: #fff;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        min-height: 100vh;
        padding: 3rem 2rem;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(102, 126, 234, 0.1) 1px,
          transparent 1px
        );
        background-size: 50px 50px;
        animation: float 20s linear infinite;
        pointer-events: none;
        z-index: 0;
      }

      h1 {
        text-align: center;
        font-size: 4rem;
        font-weight: 800;
        margin-bottom: 1rem;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(
          135deg,
          #667eea 0%,
          #764ba2 25%,
          #f093fb 50%,
          #4facfe 75%,
          #667eea 100%
        );
        background-size: 300% 300%;
        animation: gradientShift 8s ease infinite;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 3px;
        text-transform: uppercase;
        filter: drop-shadow(0 10px 20px rgba(102, 126, 234, 0.3));
        position: relative;
        z-index: 1;
        animation:
          slideDown 0.8s ease-out,
          gradientShift 8s ease infinite;
      }

      .subtitle {
        text-align: center;
        font-size: 1.1rem;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 1rem;
        font-weight: 300;
        letter-spacing: 1px;
        position: relative;
        z-index: 1;
      }

      .alert {
        max-width: 1400px;
        margin: 0 auto 2rem;
        padding: 1rem 1.25rem;
        border-radius: 16px;
        background: rgba(255, 75, 75, 0.15);
        border: 1px solid rgba(255, 75, 75, 0.35);
        color: #ffeaea;
        font-weight: 500;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      #container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(45px, 1fr));
        gap: 1.2rem;
        max-width: 1400px;
        margin: 0 auto;
        padding: 3.5rem;
        background: rgba(15, 15, 30, 0.4);
        border-radius: 30px;
        border: 2px solid rgba(102, 126, 234, 0.3);
        backdrop-filter: blur(20px);
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        position: relative;
        z-index: 1;
        animation: slideDown 1s ease-out;
      }

      #container::before {
        content: "";
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        background: linear-gradient(
          135deg,
          rgba(102, 126, 234, 0.5),
          rgba(118, 75, 162, 0.3)
        );
        border-radius: 30px;
        z-index: -1;
        opacity: 0;
        animation: pulse-glow 3s ease-in-out infinite;
      }

      input[type="checkbox"] {
        width: 100%;
        aspect-ratio: 1;
        cursor: pointer;
        accent-color: #667eea;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        appearance: none;
        -webkit-appearance: none;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(102, 126, 234, 0.4);
        border-radius: 8px;
        position: relative;
        box-shadow:
          0 4px 15px rgba(0, 0, 0, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      input[type="checkbox"]::after {
        content: "✓";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 22px;
        font-weight: 700;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      input[type="checkbox"]:checked::after {
        opacity: 1;
      }

      input[type="checkbox"]:hover {
        transform: scale(1.18) translateY(-3px);
        border-color: rgba(102, 126, 234, 0.8);
        background: rgba(102, 126, 234, 0.2);
        box-shadow:
          0 8px 25px rgba(102, 126, 234, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }

      input[type="checkbox"]:active {
        transform: scale(0.95);
      }

      input[type="checkbox"]:checked {
        background: linear-gradient(
          135deg,
          rgba(102, 126, 234, 0.6),
          rgba(118, 75, 162, 0.6)
        );
        border-color: #667eea;
        box-shadow:
          0 8px 30px rgba(102, 126, 234, 0.8),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }

      input[type="checkbox"]:checked:hover {
        background: linear-gradient(
          135deg,
          rgba(102, 126, 234, 0.8),
          rgba(118, 75, 162, 0.8)
        );
        box-shadow:
          0 12px 40px rgba(102, 126, 234, 1),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
        transform: scale(1.18) translateY(-3px);
      }

      @media (max-width: 1024px) {
        h1 {
          font-size: 3rem;
        }

        #container {
          grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
          gap: 1rem;
          padding: 2.5rem;
        }
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 2.2rem;
          margin-bottom: 0.5rem;
        }

        .subtitle {
          font-size: 0.95rem;
          margin-bottom: 2rem;
        }

        #container {
          grid-template-columns: repeat(auto-fit, minmax(35px, 1fr));
          gap: 0.8rem;
          padding: 1.8rem;
          border-radius: 20px;
        }

        input[type="checkbox"] {
          border-radius: 6px;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 1.5rem 1rem;
        }

        h1 {
          font-size: 1.8rem;
          letter-spacing: 1px;
        }

        .subtitle {
          font-size: 0.85rem;
          margin-bottom: 1.5rem;
        }

        #container {
          grid-template-columns: repeat(auto-fit, minmax(30px, 1fr));
          gap: 0.6rem;
          padding: 1.2rem;
          border-radius: 16px;
        }

        input[type="checkbox"] {
          border-radius: 4px;
        }
      }
    </style>
  </head>

  <body>
    <h1>Checkboxes</h1>
    <div class="subtitle">Interactive Checkbox Collection</div>
    <div id="alert" class="alert" hidden></div>
    <div id="container">
      <script src="/socket.io/socket.io.js"></script>
      <script>
        const socket = io();
        const container = document.getElementById("container");
        const alertBox = document.getElementById("alert");
        const CHECKBO_COUNT = 100;

        const showError = (message) => {
          if (!message) {
            alertBox.hidden = true;
            alertBox.textContent = "";
            return;
          }
          alertBox.textContent = message;
          alertBox.hidden = false;
        };

        socket.on("server-error", (data) => {
          const errorMessage = data?.error;
          showError(errorMessage || "An unexpected server error occurred.");
          console.log("Socket Server Event: ", data);
          const { index, checked } = data;

          const input = document.getElementById(`checkbox-${index}`);
          if (input) {
            input.checked = checked;
          }
        });

        window.addEventListener("load", async () => {
          const response = await fetch("/checkboxes", { method: "GET" });
          const data = await response.json();

          if (data && data.checkboxes) {
            data.checkboxes.forEach((serverValue, index) => {
              const input = document.createElement("input");
              input.type = "checkbox";
              input.id = `checkbox-${index}`;
              input.checked = serverValue;

              input.addEventListener("change", () => {
                const checked = event.target.checked;
                console.log("Checkbox Changed", { index, checked });
                socket.emit("client:checkbox-change", { index, checked });
              });
              container.appendChild(input);
            });
          }
        });

        // new Array(CHECKBO_COUNT).fill(null).forEach((_, index) => {
        //   const input = document.createElement("input");
        //   input.type = "checkbox";
        //   input.id = `checkbox-${index}`;

        //   input.addEventListener("change", () => {
        //     const checked = event.target.checked;
        //     console.log("Checkbox Changed", { index, checked });
        //     socket.emit("client:checkbox-change", { index, checked });
        //   });

        //   container.appendChild(input);
        // });
      </script>
    </div>
  </body>
</html>
